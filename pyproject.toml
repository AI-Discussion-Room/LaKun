[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakun"
version = "0.1.0"
description = "LaKun multimodal typed-decision training and inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=4.57,<5",
  "accelerate>=0.26,<2",
  "safetensors>=0.4",
  "huggingface-hub>=0.20",
  "Pillow>=10",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/AI-Discussion-Room/LaKun"

[tool.setuptools.packages.find]
where = ["."]
include = ["lakun*"]

[tool.setuptools.package-data]
"lakun.vendor.laya" = ["LICENSE"]
