[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakun"
version = "0.1.0"
description = "Typed decisions from text or one image with LaKun"
readme = "PYPI_README.md"
authors = [{ name = "AI Discussion Room" }]
license = "Apache-2.0"
license-files = ["LICENSE", "lakun/vendor/laya/LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=4.57,<5",
  "accelerate>=0.26,<2",
  "safetensors>=0.4",
  "huggingface-hub>=0.20",
  "Pillow>=10",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lakun = "lakun.cli:main"

[project.urls]
Repository = "https://github.com/AI-Discussion-Room/LaKun"

[tool.setuptools]
packages = ["lakun", "lakun.vendor", "lakun.vendor.laya"]
include-package-data = false

[tool.setuptools.package-data]
"lakun.vendor.laya" = ["LICENSE"]
